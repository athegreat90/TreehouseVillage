[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treehouse-village"
version = "0.0.0"
description = "Offline generator tooling for the Ultimate Treehouse Village vanilla datapack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rapidnbt==1.3.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
