name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-suite:
    # Offline suite only: no Minecraft, no network beyond pip/PyPI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with test extras
        run: python -m pip install -e ".[test]"
      - name: Run offline suite
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
