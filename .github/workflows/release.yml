name: Release

# Builds evidence-gated version ZIPs + SHA256SUMS.txt and uploads them as
# workflow artifacts. Creating/publishing a GitHub Release stays a human
# decision (S11: artifacts only when compatibility evidence justifies them;
# scripts/build_release.py enforces the evidence gate).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with test extras
        run: python -m pip install -e ".[test]"
      - name: Gate on the offline suite
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Build evidence-gated ZIPs and checksums
        run: python scripts/build_release.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treehouse-village-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
