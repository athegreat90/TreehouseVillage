name: Release

# Builds evidence-gated version ZIPs + SHA256SUMS.txt and uploads them as
# workflow artifacts. On a `v*` tag it additionally attaches them to a DRAFT
# GitHub Release; reviewing the assets and clicking Publish stays a human
# decision (S11: artifacts only when compatibility evidence justifies them;
# scripts/build_release.py enforces the evidence gate). Manual dispatch runs
# the build only — a dry run that creates no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with test extras
        run: python -m pip install -e ".[test]"
      - name: Gate on the offline suite
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Build evidence-gated ZIPs and checksums
        run: python scripts/build_release.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treehouse-village-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-draft:
    needs: build-artifacts
    # Tag pushes create the draft release; workflow_dispatch stays a dry run.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: treehouse-village-dist
          path: dist
      - name: Write release notes with the mandatory disclosure
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Ultimate Treehouse Village

          Evidence-gated datapack ZIPs, one per exact target version.

          ## Support status — read this first

          - `support: unverified`: compatibility evidence justifies *building* a
            version-labeled artifact (S11), never a support claim (S2).
          - `runtime_qa: pending`: no in-game placement, no client visual QA (S14)
            and no fluid-tick validation (S8) have been executed.
          - Verify every download against `SHA256SUMS.txt` (S12).

          This draft was produced automatically and has not been reviewed;
          publishing it remains a human decision.
          EOF
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --draft \
            --verify-tag \
            --title "Ultimate Treehouse Village $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
